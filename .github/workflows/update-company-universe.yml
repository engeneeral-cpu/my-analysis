name: Update NSE company universe

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update-company-universe.yml'
  schedule:
    - cron: '15 4 * * 1-5'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download NSE equity security master
        run: |
          mkdir -p data
          curl -L --fail --retry 3 -A 'Mozilla/5.0 AarohiAI/1.0' \
            'https://nsearchives.nseindia.com/content/equities/EQUITY_L.csv' \
            -o /tmp/equity.csv

      - name: Build normalized company index
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          rows=[]
          with open('/tmp/equity.csv', newline='', encoding='utf-8-sig') as f:
              for r in csv.DictReader(f):
                  series=(r.get(' SERIES') or r.get('SERIES') or '').strip()
                  symbol=(r.get('SYMBOL') or '').strip()
                  name=(r.get('NAME OF COMPANY') or '').strip()
                  isin=(r.get('ISIN NUMBER') or '').strip()
                  if symbol and name and (not series or series == 'EQ'):
                      rows.append({
                          'name': name,
                          'symbol': symbol,
                          'series': series or 'EQ',
                          'isin': isin,
                          'exchange': 'NSE',
                          'nseUrl': 'https://www.nseindia.com/get-quotes/equity?symbol=' + symbol.replace(' ','%20'),
                          'bseUrl': 'https://www.bseindia.com/'
                      })
          rows.sort(key=lambda x: x['name'].lower())
          Path('data/companies.json').write_text(json.dumps({
              'source':'NSE official security master',
              'updatedAt':__import__('datetime').datetime.now(__import__('datetime').timezone.utc).isoformat(),
              'total':len(rows),
              'results':rows
          }, ensure_ascii=False, separators=(',',':')), encoding='utf-8')
          print('Indexed', len(rows), 'companies')
          PY

      - name: Commit updated universe
        run: |
          git config user.name 'aarohi-ai-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/companies.json
          git diff --cached --quiet && exit 0
          git commit -m 'data: refresh NSE company universe'
          git push

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 180" role="img" aria-labelledby="title desc">
  <title id="title">Market Analysis</title>
  <desc id="desc">Premium market intelligence logo with an M-shaped data mark, rising bars and an upward trend line.</desc>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1677ff"/>
      <stop offset="0.55" stop-color="#14b8ff"/>
      <stop offset="1" stop-color="#19e6a8"/>
    </linearGradient>
    <linearGradient id="text" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#c9d5e6"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g transform="translate(10 15)">
    <path d="M18 132V38l66 47 67-47v94" fill="none" stroke="url(#brand)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M45 132v-24h15v24m15 0V92h15v40m15 0V73h15v59m15 0V55h15v77" fill="url(#brand)" opacity=".92"/>
    <path d="M8 126C61 118 98 86 119 62c16-18 30-29 59-47" fill="none" stroke="url(#brand)" stroke-width="9" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M170 15l18-3-7 18z" fill="#54ffc5" filter="url(#glow)"/>
  </g>
  <g transform="translate(225 36)">
    <text x="0" y="55" fill="url(#text)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="48" font-weight="800" letter-spacing="4">MARKET</text>
    <text x="0" y="105" fill="url(#text)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="42" font-weight="500" letter-spacing="8">ANALYSIS</text>
    <rect x="2" y="126" width="370" height="2" rx="1" fill="url(#brand)" opacity=".8"/>
    <text x="0" y="151" fill="#7f90a7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="3">INTELLIGENT MARKET COMPANION</text>
  </g>
</svg>

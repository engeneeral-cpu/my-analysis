<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 230" role="img" aria-labelledby="title desc">
  <title id="title">Market Analysis</title>
  <desc id="desc">Premium Market Analysis logo with a rising market intelligence mark and Tara AI companion badge.</desc>
  <defs>
    <linearGradient id="brand" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#126cff"/><stop offset=".52" stop-color="#10b9ff"/><stop offset="1" stop-color="#19e6a8"/>
    </linearGradient>
    <linearGradient id="text" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#ffffff"/><stop offset="1" stop-color="#cbd7e8"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <g transform="translate(18 24)">
    <path d="M18 150V38l72 52 72-52v112" fill="none" stroke="url(#brand)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M48 150v-30h16v30m16 0V96h16v54m16 0V75h16v75m16 0V55h16v95" fill="url(#brand)" opacity=".95"/>
    <path d="M8 143C67 134 108 98 131 70c17-20 33-33 63-52" fill="none" stroke="url(#brand)" stroke-width="10" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M185 18l21-4-8 21z" fill="#5bffc9" filter="url(#glow)"/>
  </g>
  <g transform="translate(235 32)">
    <text x="0" y="62" fill="url(#text)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="52" font-weight="850" letter-spacing="5">MARKET</text>
    <text x="0" y="112" fill="url(#text)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="42" font-weight="500" letter-spacing="9">ANALYSIS</text>
    <text x="0" y="143" fill="#d4deec" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="3">SMARTER DECISIONS</text>
    <circle cx="174" cy="139" r="3.5" fill="#19e6a8"/>
    <text x="190" y="143" fill="#d4deec" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="3">BETTER RETURNS</text>
    <rect x="0" y="160" width="315" height="2" rx="1" fill="url(#brand)" opacity=".75"/>
    <g transform="translate(0 176)">
      <rect width="315" height="42" rx="21" fill="#080e19" stroke="url(#brand)" stroke-width="2"/>
      <path d="M27 21l5-9 5 9-5 9z" fill="#19e6a8" filter="url(#glow)"/>
      <text x="50" y="27" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="800" letter-spacing="4">TARA</text>
      <text x="118" y="27" fill="#19e6a8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="800" letter-spacing="4">AI</text>
    </g>
  </g>
</svg>
